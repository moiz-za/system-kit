# Optional governance-compliance gate for repos using System Kit.
# Copy to .github/workflows/governance-check.yml — see integrations/README.md.

name: Governance Check

on:
  pull_request:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative markdown links resolve
        run: |
          fail=0
          # grep -o emits one link match per line as <file>:<line>:](<target>).
          # Rewrite each to space-separated "<file> <line> <target>" so we can
          # resolve <target> relative to <file>'s directory.
          while IFS=' ' read -r file line target; do
            case "$target" in
              '' ) continue ;;
              '#'* ) continue ;;     # in-file anchor
              'http'* ) continue ;;  # absolute URL
            esac
            if [ ! -e "$(dirname "$file")/$target" ]; then
              echo "BROKEN LINK: $file:$line -> $target"
              fail=1
            fi
          done < <(grep -rnoE '\]\(([^)]+)\)' --include='*.md' . \
            | sed -E 's#^(.+):([0-9]+):\]\((.+)\)$#\1 \2 \3#')
          exit $fail

      - name: No unresolved template placeholders
        run: |
          # Kit source files (docs/, SETUP_PROMPT.md, integrations/) ship
          # or document placeholders by design; CHANGELOG documents placeholder
          # fixes in prose. Only fail on placeholders that escaped into live
          # project files. (In your own project — where docs/ holds your
          # FILLED governance files — remove --exclude-dir=docs so unfilled
          # placeholders there get caught.)
          if grep -rn "\[PROJECT NAME\]\|\[DOMAIN LAWS" \
              --include="*.md" \
              --exclude-dir=docs \
              --exclude-dir=integrations \
              --exclude=SETUP_PROMPT.md \
              --exclude=CHANGELOG.md . ; then
            echo "FAIL: placeholder markers leaked into tracked files"
            exit 1
          fi

      - name: Version badge matches CHANGELOG
        run: |
          badge=$(grep -o 'version-[0-9]*\.[0-9]*\.[0-9]*' README.md | head -1 | cut -d- -f2)
          changelog=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "badge=$badge changelog=$changelog"
          [ "$badge" = "$changelog" ] || {
            echo "FAIL: README badge ($badge) != latest CHANGELOG version ($changelog)"
            exit 1
          }

      - name: Thread registry present
        run: |
          test -f THREADS.md || test -f docs/THREADS.md || {
            echo "FAIL: no THREADS.md registry found"
            exit 1
          }

      - name: Registry format valid
        run: |
          THREADS=$(test -f docs/THREADS.md && echo docs/THREADS.md || test -f THREADS.md && echo THREADS.md || echo "")
          if [ -z "$THREADS" ]; then
            echo "WARN: THREADS.md not found — skipping format validation"
            exit 0
          fi
          VALIDATOR=""
          for c in integrations/scripts/validate-registry.sh \
                   governance-scripts/validate-registry.sh \
                   validate-registry.sh; do
            [ -f "$c" ] && VALIDATOR="$c" && break
          done
          if [ -z "$VALIDATOR" ]; then
            echo "WARN: validate-registry.sh not installed — skipping format gate"
            exit 0
          fi
          ./"$VALIDATOR" "$THREADS" || {
            echo "FAIL: registry format problems — malformed rows silently bypass enforcement"
            exit 1
          }

      - name: BUILDLOG append-only discipline (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          VALIDATOR=""
          for c in integrations/scripts/check-buildlog.sh \
                   governance-scripts/check-buildlog.sh \
                   check-buildlog.sh; do
            [ -f "$c" ] && VALIDATOR="$c" && break
          done
          if [ -z "$VALIDATOR" ]; then
            echo "WARN: check-buildlog.sh not installed — skipping append-only gate"
            exit 0
          fi
          git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF" >/dev/null 2>&1 || true
          BASE_SHA="$(git merge-base origin/"$GITHUB_BASE_REF" HEAD 2>/dev/null || echo "")"
          if [ -z "$BASE_SHA" ]; then
            echo "WARN: could not resolve base — comparing to previous commit"
            ./"$VALIDATOR" . HEAD~1..HEAD && exit 0
          fi
          ./"$VALIDATOR" . "$BASE_SHA..HEAD" || {
            echo "FAIL: BUILDLOG history was rewritten in this PR — corrections must be new entries"
            exit 1
          }

      - name: No scope overlap (machine-checkable declaration)
        run: |
          # Find THREADS.md (docs/ or repo root)
          THREADS=$(test -f docs/THREADS.md && echo docs/THREADS.md || test -f THREADS.md && echo THREADS.md || echo "")
          if [ -z "$THREADS" ]; then
            echo "WARN: THREADS.md not found — skipping scope check"
            exit 0
          fi
          # Locate the checker: kit repo layout (integrations/scripts/),
          # installed layout (governance-scripts/), or repo root scripts/
          CHECKER=""
          for c in integrations/scripts/check-scope-overlap.sh \
                   governance-scripts/check-scope-overlap.sh \
                   check-scope-overlap.sh; do
            [ -f "$c" ] && CHECKER="$c" && break
          done
          if [ -z "$CHECKER" ]; then
            echo "WARN: check-scope-overlap.sh not installed — skipping pairwise gate"
            exit 0
          fi
          # Pairwise check: no two ACTIVE main-tree threads may declare
          # overlapping scopes. Isolated trees (worktree/copy) coexist.
          ./"$CHECKER" "$THREADS" --all || {
            echo "FAIL: scope overlap detected — see above"
            exit 1
          }

      - name: No stale threads (heartbeat discipline)
        run: |
          THREADS=$(test -f docs/THREADS.md && echo docs/THREADS.md || test -f THREADS.md && echo THREADS.md || echo "")
          if [ -z "$THREADS" ]; then
            echo "WARN: THREADS.md not found — skipping stale check"
            exit 0
          fi
          STALE_CHECKER=""
          for c in integrations/scripts/check-stale.sh \
                   governance-scripts/check-stale.sh \
                   check-stale.sh; do
            [ -f "$c" ] && STALE_CHECKER="$c" && break
          done
          if [ -z "$STALE_CHECKER" ]; then
            echo "WARN: check-stale.sh not installed — skipping stale gate"
            exit 0
          fi
          ./"$STALE_CHECKER" "$THREADS" --strict || {
            echo "NOTE: stale thread(s) found — this fails CI so abandoned"
            echo "claims cannot hide. Flag + reclaim per protocol, or heartbeat"
            echo "the thread if it is still alive (heartbeat.sh)."
            exit 1
          }

      - name: Security posture scan (credential / injection patterns)
        run: |
          PROJ="."
          SCANNER=""
          for c in integrations/scripts/check-security.sh \
                   governance-scripts/check-security.sh \
                   check-security.sh; do
            [ -f "$c" ] && SCANNER="$c" && break
          done
          if [ -z "$SCANNER" ]; then
            echo "WARN: check-security.sh not installed — skipping security gate"
            exit 0
          fi
          ./"$SCANNER" "$PROJ" || {
            echo "FAIL: security findings — see file:line above. Secrets belong"
            echo "in env vars / secret managers; injection-marker files are"
            echo "untrusted input requiring validation."
            exit 1
          }

      - name: All checkpoints complete
        run: |
          # Find docs/ folder (docs/ or repo root)
          DOCS=$(test -f docs/START_HERE.md && echo docs/ || test -f START_HERE.md && echo . || echo "")
          if [ -z "$DOCS" ]; then
            echo "WARN: docs/ folder not found — skipping checkpoint validation"
            exit 0
          fi
          VALIDATOR=""
          for c in integrations/scripts/validate-checkpoint.sh \
                   governance-scripts/validate-checkpoint.sh \
                   validate-checkpoint.sh; do
            [ -f "$c" ] && VALIDATOR="$c" && break
          done
          if [ -z "$VALIDATOR" ]; then
            echo "WARN: validate-checkpoint.sh not installed — skipping checkpoint gate"
            exit 0
          fi
          ./"$VALIDATOR" "$DOCS" || {
            echo "FAIL: incomplete checkpoint(s) found — see above"
            exit 1
          }
